databaseChangeLog:
  - changeSet:
      id: 5-add-status-to-client
      author: mikhail
      preConditions:
        - onFail: HALT
        - not:
            columnExists:
              tableName: client
              columnName: status
      changes:
        - addColumn:
            tableName: client
            columns:
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false