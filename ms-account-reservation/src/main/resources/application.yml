spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/account_reservation}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
        exclude: env, shutdown
  endpoint:
    health:
      show-details: always
      enabled: true
    shutdown:
      enabled: false
  server:
    port: ${MANAGEMENT_PORT:8081}
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${API_BASE_PATH:/api/v1}

currency-client-starter:
  enabled: true
  health:
    enabled: true

app:
  currency-client:
      base-url: ${CURRENCY_CLIENT_BASE_URL:https://api.frankfurter.dev}
      rate-path: ${CURRENCY_CLIENT_RATE_PATH:/v2/rate}

      timeout:
        connect-timeout: ${CURRENCY_CLIENT_CONNECT_TIMEOUT:5000}
        read-timeout: ${CURRENCY_CLIENT_READ_TIMEOUT:5000}

      retry:
        max-attempts: ${CURRENCY_CLIENT_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${CURRENCY_CLIENT_RETRY_WAIT_DURATION:500}

      rate-limiter:
        limit-for-period: ${CURRENCY_CLIENT_RATE_LIMITER_LIMIT_FOR_PERIOD:10}
        limit-refresh-period: ${CURRENCY_CLIENT_RATE_LIMITER_LIMIT_REFRESH_PERIOD:1s}
        timeout-duration: ${CURRENCY_CLIENT_RATE_LIMITER_TIMEOUT_DURATION:0s}